    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline adjustment for Open to Work badge */
        .hero-subtitle-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .open-to-work-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
            animation: pulseGlow 2s infinite ease-in-out;
        }
        .open-to-work-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: blinkDot 1.5s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 0 18px rgba(34, 197, 94, 0.5); }
        }
        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Glowing Stats Counter Row Styles */
        .hero-stats-row {
            display: flex;
            gap: 24px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .hero-stat-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            background: var(--bg-card, rgba(255, 255, 255, 0.03));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .hero-stat-card:hover {
            border-color: var(--primary, #6366f1);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
            transform: translateY(-3px);
        }
        .hero-stat-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary, #6366f1);
            border-radius: 10px;
            font-size: 1.1rem;
        }
        .hero-stat-info {
            display: flex;
            flex-direction: column;
        }
        .hero-stat-number {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-heading, #ffffff);
            font-family: 'Outfit', sans-serif;
        }
        .hero-stat-label {
            font-size: 0.8rem;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
        }
        
        /* Fallback/Fix for Project Card Images */
        .project-img, .project-card img, .project-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            min-height: 200px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
        }
    </style>
</head>
